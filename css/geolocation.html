<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Localizador de Cajeros - BCR</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="geolocation-styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Localizador de Cajeros Automáticos</h1>
            <p>Encuentra los cajeros más cercanos a tu ubicación</p>
        </header>
        
        <main class="atm-finder">
            <div class="controls">
                <button id="locate-btn" class="btn locate-btn">
                    <span class="icon">📍</span> Encontrar cajeros cercanos
                </button>
                
                <div class="filter-group">
                    <label for="filter-distance">Distancia máxima:</label>
                    <select id="filter-distance">
                        <option value="1">1 km</option>
                        <option value="2" selected>2 km</option>
                        <option value="5">5 km</option>
                        <option value="10">10 km</option>
                    </select>
                </div>
            </div>
            
            <div id="status" class="status-message"></div>
            
            <div class="map-results">
                <div id="map" class="map-container"></div>
                
                <div class="atm-list-container">
                    <h3><span class="icon">🏧</span> Cajeros encontrados</h3>
                    <div id="results" class="atm-list"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        let map;
        let userMarker;
        let atmMarkers = [];
        
        document.getElementById('locate-btn').addEventListener('click', function() {
            const status = document.getElementById('status');
            status.textContent = "Buscando tu ubicación...";
            status.className = "status-message loading";
            
            if (!navigator.geolocation) {
                status.textContent = "Geolocalización no soportada en tu navegador";
                status.className = "status-message error";
                return;
            }
            
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const distance = document.getElementById('filter-distance').value;
                    
                    status.textContent = `Ubicación encontrada! Mostrando cajeros en un radio de ${distance} km`;
                    status.className = "status-message success";
                    
                    // Simular datos de cajeros (en producción sería una API real)
                    const atms = generateATMs(lat, lng, distance);
                    
                    displayResults(atms);
                    initMap(lat, lng, atms);
                },
                function(error) {
                    let errorMessage;
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMessage = "Permiso denegado. Por favor habilita la geolocalización.";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMessage = "La información de ubicación no está disponible.";
                            break;
                        case error.TIMEOUT:
                            errorMessage = "La solicitud de ubicación ha expirado.";
                            break;
                        default:
                            errorMessage = "Error desconocido al obtener la ubicación.";
                    }
                    status.textContent = errorMessage;
                    status.className = "status-message error";
                }
            );
        });
        
        function generateATMs(userLat, userLng, distanceKm) {
            const atms = [];
            const distance = parseFloat(distanceKm);
            const count = 5 + Math.floor(Math.random() * 6); // 5-10 cajeros
            
            for (let i = 0; i < count; i++) {
                // Generar ubicaciones aleatorias dentro del radio
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * distance * 0.01; // Grados aprox (1km ~ 0.009 grados)
                
                const lat = userLat + radius * Math.cos(angle);
                const lng = userLng + radius * Math.sin(angle);
                
                const atmDistance = calculateDistance(userLat, userLng, lat, lng);
                
                atms.push({
                    id: i + 1,
                    name: `BCR ${['Central', 'San Pedro', 'Escazú', 'Curridabat', 'Heredia', 'Alajuela'][i % 6]}`,
                    lat: lat,
                    lng: lng,
                    distance: atmDistance.toFixed(1),
                    hasCash: Math.random() > 0.3,
                    is24h: Math.random() > 0.5
                });
            }
            
            // Ordenar por distancia
            return atms.sort((a, b) => a.distance - b.distance);
        }
        
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radio de la Tierra en km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }
        
        function displayResults(atms) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';
            
            if (atms.length === 0) {
                resultsDiv.innerHTML = '<p class="no-results">No se encontraron cajeros en el área seleccionada</p>';
                return;
            }
            
            atms.forEach(atm => {
                const atmElement = document.createElement('div');
                atmElement.className = 'atm-item';
                atmElement.innerHTML = `
                    <div class="atm-header">
                        <h4>${atm.name}</h4>
                        <span class="distance">${atm.distance} km</span>
                    </div>
                    <div class="atm-details">
                        <p class="address">Aproximadamente ${(atm.distance * 1000).toFixed(0)} metros de tu ubicación</p>
                        <div class="atm-features">
                            <span class="feature ${atm.hasCash ? 'available' : 'unavailable'}">${atm.hasCash ? '💵 Con efectivo' : '⚠️ Sin efectivo'}</span>
                            <span class="feature ${atm.is24h ? 'available' : 'unavailable'}">${atm.is24h ? '🕒 24/7' : '⏳ Horario limitado'}</span>
                        </div>
                    </div>
                    <button class="btn small" data-lat="${atm.lat}" data-lng="${atm.lng}">Ver en mapa</button>
                `;
                
                resultsDiv.appendChild(atmElement);
            });
            
            // Add event listeners to map buttons
            document.querySelectorAll('.btn[data-lat]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const lat = parseFloat(this.getAttribute('data-lat'));
                    const lng = parseFloat(this.getAttribute('data-lng'));
                    map.setView([lat, lng], 17);
                });
            });
        }
        
        function initMap(lat, lng, atms) {
            // Initialize map if not already done
            if (!map) {
                map = L.map('map').setView([lat, lng], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(map);
            } else {
                map.setView([lat, lng], 15);
            }
            
            // Clear existing markers
            if (userMarker) map.removeLayer(userMarker);
            atmMarkers.forEach(marker => map.removeLayer(marker));
            atmMarkers = [];
            
            // Add user marker
            userMarker = L.marker([lat, lng], {
                icon: L.divIcon({
                    className: 'user-marker',
                    html: '📍',
                    iconSize: [30, 30]
                })
            }).addTo(map);
            userMarker.bindPopup("<b>Tu ubicación</b>").openPopup();
            
            // Add ATM markers
            atms.forEach(atm => {
                const marker = L.marker([atm.lat, atm.lng], {
                    icon: L.divIcon({
                        className: `atm-marker ${atm.hasCash ? 'with-cash' : 'no-cash'}`,
                        html: atm.hasCash ? '🏧' : '⚠️',
                        iconSize: [30, 30]
                    })
                }).addTo(map);
                
                marker.bindPopup(`
                    <b>${atm.name}</b><br>
                    Distancia: ${atm.distance} km<br>
                    ${atm.hasCash ? '💵 Con efectivo' : '⚠️ Sin efectivo'}<br>
                    ${atm.is24h ? '🕒 Abierto 24/7' : '⏳ Horario limitado'}
                `);
                
                atmMarkers.push(marker);
            });
        }
        
        // Initialize map container (without location)
        document.addEventListener('DOMContentLoaded', function() {
            const mapContainer = document.getElementById('map');
            mapContainer.innerHTML = `
                <div class="map-placeholder">
                    <p>Presiona "Encontrar cajeros cercanos" para ver tu ubicación en el mapa</p>
                </div>
            `;
        });
    </script>
</body>
</html>
