<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Intereses - BCR</title>
</head>
<body>
    <h1>Calculadora de Intereses Compuestos</h1>
    
    <div>
        <label for="principal">Monto inicial (₡):</label>
        <input type="number" id="principal" value="100000">
    </div>
    
    <div>
        <label for="rate">Tasa de interés anual (%):</label>
        <input type="number" id="rate" step="0.01" value="5.5">
    </div>
    
    <div>
        <label for="years">Plazo (años):</label>
        <input type="number" id="years" value="5">
    </div>
    
    <div>
        <label for="monthly">Aporte mensual (₡):</label>
        <input type="number" id="monthly" value="20000">
    </div>
    
    <button id="calculate">Calcular</button>
    
    <div id="status"></div>
    
    <table id="results" border="1" style="margin-top: 20px;">
        <thead>
            <tr>
                <th>Año</th>
                <th>Monto Acumulado</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        document.getElementById('calculate').addEventListener('click', function() {
            const status = document.getElementById('status');
            status.textContent = "Calculando...";
            
            const worker = new Worker('worker.js');
            
            worker.postMessage({
                principal: parseFloat(document.getElementById('principal').value),
                rate: parseFloat(document.getElementById('rate').value),
                years: parseInt(document.getElementById('years').value),
                monthlyContribution: parseFloat(document.getElementById('monthly').value)
            });
            
            worker.onmessage = function(e) {
                const tbody = document.getElementById('results').querySelector('tbody');
                tbody.innerHTML = '';
                
                e.data.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${row.year}</td><td>₡${row.amount}</td>`;
                    tbody.appendChild(tr);
                });
                
                status.textContent = "Cálculo completo!";
            };
            
            worker.onerror = function(error) {
                status.textContent = "Error en el cálculo: " + error.message;
            };
        });
    </script>
</body>
</html>
